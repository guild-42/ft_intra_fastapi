# Guild42 Coolify デプロイ用 (infra-coolify-expert SKILL 準拠)。
#  - `version:` キーは書かない (Compose V2。書くと "services section not found" になる)
#  - `ports:` は書かない (Traefik が coolify network 経由でルーティング)
#  - Coolify の Domains 欄には http://<domain>:8000 を設定 (https:// にしない)
# Coolify は guild-42/ft_intra_fastapi repo の本ファイルを Docker Compose ビルドパックで読む。
# 値 ${...} は Coolify の Environment Variables で設定 (git に secret は入れない)。
# Coolify の env 値は 256 byte 上限のため、SA 鍵(JSON)は env ではなく
# ホストのファイル /opt/ft-intra-secrets/sa.json を read-only bind mount で渡す
# (ファイル本体はサーバ上のみ。git にはパスしか入らない)。
# DB は Firestore、push は FCM。どちらも /secrets/sa.json の SA 鍵で繋ぐ。
services:
  ft-intra-backend:
    build: .
    container_name: ft-intra-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      PORT: 8000
      # --- 42 API creds は env ではなく /secrets/ft.env から読む(entrypoint.sh が source)---
      # Coolify env は値が空で注入される不調があったため、SA 鍵と同じファイル方式に統一
      # --- Firestore / FCM の Service Account 鍵 ---
      # 下の volumes でマウントしたファイルを指す(env に JSON 全文は入れない)
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa.json
      # --- poller 間隔・対象 (任意。未設定なら下記 default) ---
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      REVIEW_POLL_INTERVAL_SECONDS: ${REVIEW_POLL_INTERVAL_SECONDS:-300}
      FRIEND_POLL_INTERVAL_SECONDS: ${FRIEND_POLL_INTERVAL_SECONDS:-120}
      CHECKOUT_SWEEP_INTERVAL_SECONDS: ${CHECKOUT_SWEEP_INTERVAL_SECONDS:-600}
      FRIEND_POLLER_CAMPUS_IDS: ${FRIEND_POLLER_CAMPUS_IDS:-26}
      CHECKIN_TTL_SECONDS: ${CHECKIN_TTL_SECONDS:-10800}
    volumes:
      # secret はサーバ上のファイルを read-only でマウント(Coolify env の制限/不調回避)
      - /opt/ft-intra-secrets/sa.json:/secrets/sa.json:ro
      - /opt/ft-intra-secrets/ft.env:/secrets/ft.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - coolify
      - default

networks:
  coolify:
    external: true
